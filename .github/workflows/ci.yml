name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build (warnings are errors)
        run: dotnet build --no-restore -c Release

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Test with coverage
        run: dotnet test --no-build -c Release --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Audit the sample data (exit 1 = findings, which the sample is built to contain)
        run: |
          set +e
          dotnet run --no-build -c Release --project src/PaymentAnomalies.Cli
          code=$?
          if [ "$code" -ne 1 ]; then echo "expected exit code 1, got $code"; exit 1; fi

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
