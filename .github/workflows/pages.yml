name: Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Export the sample audit as JSON (exit 1 = findings, which the sample is built to contain)
        run: |
          mkdir -p web/public/data
          set +e
          dotnet run --project src/PaymentAnomalies.Cli -c Release -- data findings.csv --json web/public/data/report.json
          code=$?
          if [ "$code" -ne 1 ]; then echo "expected exit code 1, got $code"; exit 1; fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web app
        run: |
          npm ci
          npm run build
        working-directory: web

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
